name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  GO_VERSION: "1.24.4"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "27.0.12077973"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android client
        uses: actions/checkout@v6

      - name: Checkout x-tunnel core
        uses: actions/checkout@v6
        with:
          # 自研 fork：main 已合入 feat/dns-cache 三 commit，作为 Android sidecar 构建基线
          repository: callacat/x-tunnel
          path: external/x-tunnel

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: external/x-tunnel/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 版本号自动递增（东哥 2026-08-29 拍板）：round N = git 提交总数
      # （git rev-list --count HEAD），每 push 一次代码 N 自动 +1，无需人工改。
      # 三处（versionName / APK 文件名 / 首页显示）同一来源：versionName 由 env 注入，
      # 首页显示动态读 versionName，APK 文件名在 artifact 上传时带 versionName。
      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          name="0.1.0-round${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "XTUNNEL_ANDROID_VERSION_NAME=${name}" >> "$GITHUB_ENV"
          echo "XTUNNEL_ANDROID_VERSION_CODE=${count}" >> "$GITHUB_ENV"

      - name: Build hev-socks5-tunnel arm64
        run: bash ./scripts/build-hev-android.sh

      - name: Build x-tunnel arm64 sidecar
        run: |
          XTUNNEL_CORE_VERSION="${XTUNNEL_CORE_VERSION:-android-dev}" \
          XTUNNEL_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          bash ./scripts/build-core-android.sh

      - name: Build and lint APKs
        run: ./gradlew --no-daemon assembleDebug lintDebug assembleRelease bundleRelease

      - name: Verify native release assets
        run: bash ./scripts/verify-release-assets.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: x-tunnel-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release package outputs
        uses: actions/upload-artifact@v7
        with:
          name: x-tunnel-${{ steps.version.outputs.name }}-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            SHA256SUMS
